[theme]
base = "dark"
primaryColor = "#7C5CFF"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#11151F"
textColor = "#E7E9EE"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
